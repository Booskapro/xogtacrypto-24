<script>
document.addEventListener("DOMContentLoaded", function () {
  var s = window.SITE, f = s.founder, EN = window.I18N.lang === "en";
  var xIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';
  var people = [{ name: f.name, role: f.role, role_en: f.role_en, photo: f.photo, handle: f.handle, x: f.x, desc: f.desc, desc_en: f.desc_en, lead: true }].concat(s.team || []);
  var grid = document.getElementById("team-grid");
  people.forEach(function (m) {
    var card = document.createElement(m.x ? "a" : "article"); card.className = "pc" + (m.lead ? " lead" : "");
    if (m.x) { card.href = m.x; card.target = "_blank"; card.rel = "noopener"; }
    if (m.photo) { var img = document.createElement("img"); img.src = m.photo; img.alt = m.name; img.loading = "lazy"; card.appendChild(img); }
    else { var ini = document.createElement("div"); ini.className = "pc-ini"; ini.textContent = m.name.charAt(0); card.appendChild(ini); }
    var inn = document.createElement("div"); inn.className = "pc-in";
    var rl = document.createElement("span"); rl.className = "pc-rl"; rl.textContent = EN && m.role_en ? m.role_en : m.role;
    var nm = document.createElement("h3"); nm.className = "pc-nm"; nm.textContent = m.name;
    inn.appendChild(rl); inn.appendChild(nm);
    var d = EN && m.desc_en ? m.desc_en : m.desc;
    if (d) { var ds = document.createElement("p"); ds.className = "pc-ds"; ds.textContent = d; inn.appendChild(ds); }
    if (m.x) { var x = document.createElement("span"); x.className = "pc-x"; x.innerHTML = "<i>" + xIcon + "</i><span></span>"; x.querySelector("span").textContent = m.handle || "X"; inn.appendChild(x); }
    card.appendChild(inn); grid.appendChild(card);
  });
});
</script>
