<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ku saabsan | Xogta Crypto 24/7</title>
  <meta name="title-en" content="About – Xogta Crypto 24/7">
  <meta name="description" content="Xogta Crypto 24/7: xogta suuqa oo dhan, hal meel, af-Soomaali. Aasaasaha: Booskapro (@booskapro).">
  <meta name="theme-color" content="#0B1220">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
</head>
<body>
<header data-header="ku-saabsan"></header>
<main class="wrap about">
  <section class="ab-hero">
    <span class="eyebrow" data-en="ABOUT">KU SAABSAN</span>
    <h1 class="ab-title" data-en="All the market data. One place.">Xogta suuqa oo dhan. Hal meel.</h1>
    <p class="lead" data-en="Fed decisions, economic data, crypto, gold, oil and stocks — live, in Somali and English.">Go'aannada FED-ka, xogta dhaqaalaha, crypto, dahab, shidaal iyo saamiyo — oo toos ah, af-Soomaali iyo English.</p>
  </section>

  <section class="fcard" id="aasaasaha">
    <div class="fcard-photo" id="founder-photo">B</div>
    <div class="fcard-body">
      <span class="fcard-lab" data-en="FOUNDER">AASAASAHA</span>
      <h2 class="fcard-name" id="founder-name">—</h2>
      <p class="fcard-role" id="founder-role"></p>
      <blockquote class="fcard-quote" id="founder-quote"></blockquote>
      <p class="fcard-text" id="founder-bio"></p>
      <div class="fcard-btns" id="socials"></div>
    </div>
  </section>
</main>
<footer data-footer></footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var s = window.SITE, f = s.founder, EN = window.I18N.lang === "en";
  document.getElementById("founder-name").textContent = f.name;
  document.getElementById("founder-role").textContent = (EN && f.role_en ? f.role_en : f.role) + " · " + s.name;
  document.getElementById("founder-bio").textContent = EN && f.bio_en ? f.bio_en : f.bio;
  var q = EN && f.quote_en ? f.quote_en : f.quote, qEl = document.getElementById("founder-quote");
  if (q) qEl.textContent = q; else qEl.hidden = true;
  var ph = document.getElementById("founder-photo");
  if (f.photo) { ph.textContent = ""; var img = document.createElement("img"); img.src = f.photo; img.alt = f.name; ph.appendChild(img); ph.classList.add("has-img"); }
  else { ph.textContent = f.name.charAt(0); }
  var icons = { x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>' };
  var names = { x: "X", telegram: "Telegram", youtube: "YouTube", tiktok: "TikTok", facebook: "Facebook", instagram: "Instagram" };
  var box = document.getElementById("socials");
  Object.keys(names).forEach(function (k) {
    if (!s.social[k]) return;
    var a = document.createElement("a");
    a.className = "fbtn"; a.href = s.social[k]; a.rel = "noopener";
    a.innerHTML = (icons[k] || "") + "<span></span>";
    a.querySelector("span").textContent = k === "x" && f.handle ? f.handle : names[k];
    box.appendChild(a);
  });
  if (s.email) { var e = document.createElement("a"); e.className = "fbtn"; e.href = "mailto:" + s.email; e.textContent = s.email; box.appendChild(e); }
});
</script>
</body>
</html>
