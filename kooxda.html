<body>
<header data-header="ku-saabsan"></header>
<main class="wrap ab2">
  <section class="ab2-hero">
    <span class="eyebrow" data-en="TEAM">KOOXDA</span>
    <h1 class="ab2-title" style="margin-top:14px" data-en="Founders">Aasaasayaasha</h1>
  </section>
  <section class="ab2-team" style="padding-top:8px" id="aasaasaha">
    <div class="ab2-grid" id="team-grid"></div>
  </section>
</main>
<footer data-footer></footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var s = window.SITE, f = s.founder, EN = window.I18N.lang === "en";
  var xIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';
  var people = [{ name: f.name, role: f.role, role_en: f.role_en, photo: f.photo, handle: f.handle, x: f.x }].concat(s.team || []);
  var grid = document.getElementById("team-grid");
  people.forEach(function (m) {
    var card = document.createElement("article"); card.className = "ex";
    var ph = document.createElement("div"); ph.className = "ex-ph";
    if (m.photo) { var img = document.createElement("img"); img.src = m.photo; img.alt = m.name; ph.appendChild(img); }
    else ph.textContent = m.name.charAt(0);
    var nm = document.createElement("h3"); nm.className = "ex-nm"; nm.textContent = m.name;
    var rl = document.createElement("p"); rl.className = "ex-rl"; rl.textContent = EN && m.role_en ? m.role_en : m.role;
    card.appendChild(ph); card.appendChild(nm); card.appendChild(rl);
    if (m.x) { var a = document.createElement("a"); a.className = "ex-x"; a.href = m.x; a.target = "_blank"; a.rel = "noopener"; a.innerHTML = xIcon + "<span></span>"; a.querySelector("span").textContent = m.handle || ""; card.appendChild(a); }
    grid.appendChild(card);
  });
});
</script>
