<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Maamulka · Xogta Crypto 24/7</title>
  <meta name="theme-color" content="#0B1220">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="layout.js"></script>
  <style>
    .ad { padding-top: 34px; padding-bottom: 60px; }
    .ad-login { max-width: 420px; margin: 40px auto; text-align: center; }
    .ad-login #ad-w { display: flex; justify-content: center; margin-top: 18px; min-height: 44px; }
    .ad-msg { margin-top: 14px; color: var(--muted); font-size: .9rem; } .ad-msg.bad { color: #F05A5F; }
    .ad-kp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 18px 0 22px; }
    .ad-kp div { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
    .ad-kp span { display: block; font-size: .75rem; color: var(--muted); } .ad-kp b { font-family: var(--font-display); font-size: 1.7rem; }
    .ad-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 26px 0 10px; }
    .ad-row h2 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; }
    .ad-tools { display: flex; gap: 8px; } .ad-tools input { background: var(--card); border: 1px solid var(--line-2); color: var(--text); border-radius: 10px; padding: 8px 12px; font: inherit; font-size: .85rem; min-width: 200px; }
    .ad-btn { background: var(--text); color: var(--bg); border: 0; border-radius: 10px; padding: 8px 14px; font: 700 .82rem Inter, sans-serif; cursor: pointer; }
    .ad-tbl { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; font-size: .86rem; }
    .ad-tbl th { text-align: left; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--card-2); padding: 10px 12px; }
    .ad-tbl td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
    .ad-u { display: flex; align-items: center; gap: 10px; } .ad-u img, .ad-u i { width: 32px; height: 32px; border-radius: 50%; background: var(--card-2); flex-shrink: 0; }
    .ad-u a { color: var(--accent-ink); text-decoration: none; font-size: .78rem; }
    .ad-tag { font-size: .7rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; } .ad-tag.y { background: rgba(43,214,123,.15); color: #2BD67B; } .ad-tag.n { background: rgba(240,90,95,.15); color: #F05A5F; } .ad-tag.a { background: rgba(63,184,255,.15); color: #3FB8FF; }
    .ad-days { width: 100%; border-collapse: collapse; font-size: .82rem; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .ad-days th, .ad-days td { padding: 8px 10px; text-align: right; border-top: 1px solid var(--line); } .ad-days th { color: var(--muted); font-size: .7rem; text-transform: uppercase; background: var(--card-2); border-top: 0; } .ad-days td:first-child, .ad-days th:first-child { text-align: left; }
    .ad-scroll { overflow-x: auto; }
    @media (max-width: 760px) { .ad-kp { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ad-hide { display: none; } }
  </style>
</head>
<body>
<header data-header="admin"></header>
<main class="wrap ad">
  <span class="eyebrow">MAAMULKA · ADMIN</span>
  <h1 class="h1">Xubnaha iyo booqashooyinka</h1>
  <div id="ad"></div>
</main>
<footer data-footer></footer>
<script>
(function () {
  "use strict";
  const root = document.getElementById("ad");
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  const api = (op, body) => fetch("/api/member?op=" + op, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined }).then((r) => r.json());
  const dt = (t) => t ? new Date(t).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
  let DATA = null;

  function login(msg, bad) {
    root.innerHTML = `<form class="ad-login card" style="padding:28px" id="ad-f">
      <p><b>Password-ka maamulka</b> geli.</p>
      <input id="ad-pw" type="password" autocomplete="current-password" required placeholder="Password" style="width:100%;margin-top:10px;background:var(--card-2);border:1px solid var(--line-2);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit">
      <button type="submit" id="ad-go" style="display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#3FB8FF;color:#04121F;font:800 1rem Inter,sans-serif;cursor:pointer">Gal / Log in →</button>
      <label style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;font-size:.85rem;color:var(--muted);cursor:pointer"><input type="checkbox" id="ad-sh"> Tus password-ka</label>
      <div class="ad-msg${bad ? " bad" : ""}">${msg || ""}</div></form>`;
    root.querySelector("#ad-f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const go = root.querySelector("#ad-go"); go.disabled = true; go.textContent = "Waa la hubinayaa…";
      let r = null, why = "";
      try {
        const res = await fetch("/api/member?op=admin", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pw: root.querySelector("#ad-pw").value }) });
        const txt = await res.text();
        try { r = JSON.parse(txt); } catch (e) { why = res.status === 404 ? "API-ga lama helin (404): hubi in api/_member.js, api/macro.js iyo vercel.json la galiyay." : "Server-ka khalad (" + res.status + "): hubi Vercel → Deployments."; }
      } catch (e) { why = "Internet-ka ama server-ka lama gaari karo."; }
      if (r && r.t) { set("xc-adm", r.t); load(); }
      else login(why || (r && r.error ? esc(r.error) : "Isku day mar kale."), true);
    });
    root.querySelector("#ad-sh").addEventListener("change", (e) => { root.querySelector("#ad-pw").type = e.target.checked ? "text" : "password"; });
    root.querySelector("#ad-pw").focus();
  }
  async function load() {
    const t = get("xc-adm");
    if (!t) return login();
    root.innerHTML = `<p class="ad-msg">Xogta ayaa soo socota…</p>`;
    const r = await api("list", { t }).catch(() => null);
    if (!r || r.error) return login(r && r.error ? esc(r.error) : "", true);
    DATA = r; render("");
  }
  function render(q) {
    const r = DATA, now = Date.now(), d7 = now - 7 * 864e5;
    const mem = r.members.filter((m) => m.member), today = new Date().toISOString().slice(0, 10);
    const newToday = r.members.filter((m) => m.first && new Date(m.first).toISOString().slice(0, 10) === today).length;
    const new7 = r.members.filter((m) => (m.first || 0) > d7).length, act7 = r.members.filter((m) => (m.last || 0) > d7).length;
    const rows = r.members.filter((m) => !q || (m.name + " " + m.username).toLowerCase().includes(q.toLowerCase()));
    const sum = (k) => r.days.reduce((a, d) => a + (d[k] || 0), 0);
    root.innerHTML = (r.kv ? "" : `<p class="ad-msg bad">Database (KV) lama helin.</p>`) + `
      <div class="ad-kp">
        <div><span>Xubnaha bogga (Telegram login)</span><b>${mem.length}</b></div>
        <div><span>Kooxda Telegram (wadarta)</span><b>${r.group != null ? r.group.toLocaleString("en-US") : "—"}</b></div>
        <div><span>Cusub maanta · 7 maalin</span><b>${newToday} · ${new7}</b></div>
        <div><span>Firfircoon 7 maalin</span><b>${act7}</b></div>
      </div>
      <div class="ad-row"><h2>14-kii maalmood ee u dambeeyay</h2><span class="ad-msg" style="margin:0">Qufulka la arkay: ${sum("charts:gate") + sum("kalandarka:gate") + sum("lacagta:gate")} · login cusub: ${sum("joins")}</span></div>
      <div class="ad-scroll"><table class="ad-days"><tr><th>Maalin</th><th>Charts (bilaash)</th><th>Charts (xubno)</th><th>Kalandarka (bilaash)</th><th>Kalandarka (xubno)</th><th>Qufulka la arkay</th><th>Login cusub</th></tr>
      ${r.days.slice().reverse().map((d) => `<tr><td>${esc(d.d)}</td><td>${d["charts:view"] || 0}</td><td>${d["charts:member"] || 0}</td><td>${d["kalandarka:view"] || 0}</td><td>${d["kalandarka:member"] || 0}</td><td>${(d["charts:gate"] || 0) + (d["kalandarka:gate"] || 0) + (d["lacagta:gate"] || 0)}</td><td>${d.joins || 0}</td></tr>`).join("")}</table></div>
      <div class="ad-row"><h2>Xubnaha (${rows.length})</h2><div class="ad-tools"><input id="ad-q" placeholder="Raadi magac ama @username" value="${esc(q)}"><button class="ad-btn" id="ad-csv">Soo deji CSV</button></div></div>
      <div class="ad-scroll"><table class="ad-tbl"><tr><th>Qofka</th><th>Xaaladda</th><th class="ad-hide">Ku biiray</th><th>Booqashadii u dambaysay</th><th class="ad-hide">Booqasho</th></tr>
      ${rows.map((m) => `<tr><td><div class="ad-u">${m.photo ? `<img src="${esc(m.photo)}" alt="" loading="lazy">` : "<i></i>"}<div><b>${esc(m.name)}</b><br>${m.username ? `<a href="https://t.me/${esc(m.username)}" target="_blank" rel="noopener">@${esc(m.username)}</a>` : `<span class="ad-msg">ID ${esc(m.id)}</span>`}</div></div></td>
        <td>${m.admin ? '<span class="ad-tag a">Admin</span>' : m.member ? '<span class="ad-tag y">Xubin</span>' : '<span class="ad-tag n">Kooxda kuma jiro</span>'}</td>
        <td class="ad-hide">${dt(m.first)}</td><td>${dt(m.last)}</td><td class="ad-hide">${m.views || 0}</td></tr>`).join("") || `<tr><td colspan="5" class="ad-msg">Weli xubno ma jiraan.</td></tr>`}</table></div>
      <p class="ad-msg" style="margin-top:16px"><a href="#" id="ad-out">Ka bax (logout)</a></p>`;
    const qi = root.querySelector("#ad-q");
    qi.addEventListener("input", () => { const v = qi.value; render(v); const n = root.querySelector("#ad-q"); n.focus(); n.setSelectionRange(v.length, v.length); });
    root.querySelector("#ad-csv").addEventListener("click", () => {
      const lines = [["id", "name", "username", "status", "first", "last", "views"].join(",")].concat(r.members.map((m) => [m.id, m.name, m.username, m.admin ? "admin" : m.member ? "member" : "not-member", m.first ? new Date(m.first).toISOString() : "", m.last ? new Date(m.last).toISOString() : "", m.views || 0].map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(",")));
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" })); a.download = "xubnaha-xogta-crypto-" + new Date().toISOString().slice(0, 10) + ".csv"; a.click();
    });
    root.querySelector("#ad-out").addEventListener("click", (e) => { e.preventDefault(); set("xc-adm", null); login(); });
  }
  load();
})();
</script>
</body>
</html>
